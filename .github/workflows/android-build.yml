name: Android APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (manual, avoids deprecated 'tools' package)
        env:
          SDK_URL: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        run: |
          ANDROID_SDK="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK"
          cd "$ANDROID_SDK"
          curl -L -o cmdline-tools.zip "$SDK_URL"
          unzip -q cmdline-tools.zip
          mv cmdline-tools cmdline-tools/latest
          rm cmdline-tools.zip
          echo "ANDROID_HOME=$ANDROID_SDK" >> $GITHUB_ENV
          echo "$ANDROID_SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | cmdline-tools/latest/bin/sdkmanager --licenses
          cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error